# Conda environment for the BINP52 pipeline (metaphlan).
# Create on COSMOS (after loading your conda module):
#   conda env create -f envs/metaphlan.yml
# Versions are not pinned here; after creating it, record the exact
# versions for your thesis with:
#   conda env export -n binp52_metaphlan > docs/binp52_metaphlan.lock.yml
name: binp52_metaphlan
channels:
  - conda-forge
  - bioconda
dependencies:
  - metaphlan
  - bowtie2
